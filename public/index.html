<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Family Booking</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#f5f5f2}body{margin:0}.wrap{max-width:1000px;margin:0 auto;padding:48px 20px}h1{font-size:42px;margin:0 0 8px}.muted{color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.card{background:white;border:1px solid #ddd;border-radius:18px;padding:22px;box-shadow:0 4px 20px #00000008}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile,.booking{padding:12px;border:1px solid #ddd;border-radius:12px;margin:10px 0}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;margin-top:6px}button{margin-top:14px;border:0;border-radius:10px;padding:12px 16px;background:#111;color:white;cursor:pointer}.status{white-space:pre-wrap;margin-top:14px;font-size:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Family Booking</h1>
  <p class="muted">Gestisci 4 profili e prepara 4 prenotazioni in un unico flusso.</p>
  <div class="grid">
    <section class="card"><h2>4 account</h2><div id="profiles"></div><button id="accounts">Prepara account</button></section>
    <section class="card"><h2>4 ristoranti</h2><div id="bookings"></div><button id="reserve">Prepara prenotazioni</button></section>
  </div>
  <div class="card" style="margin-top:20px"><strong>Stato</strong><div id="status" class="status">In attesa.</div></div>
</div>
<script>
const profileBox=document.querySelector('#profiles'), bookingBox=document.querySelector('#bookings'), status=document.querySelector('#status');
for(let i=1;i<=4;i++) profileBox.insertAdjacentHTML('beforeend',`<div class="profile"><strong>Persona ${i}</strong><div class="row"><label>Nome<input data-p="name" data-i="${i}"></label><label>Email<input data-p="email" type="email" data-i="${i}"></label></div></div>`);
for(let i=1;i<=4;i++) bookingBox.insertAdjacentHTML('beforeend',`<div class="booking"><strong>Ristorante ${i}</strong><label>Nome<input data-b="restaurant" data-i="${i}"></label><div class="row"><label>Data<input data-b="date" type="date" data-i="${i}"></label><label>Ora<input data-b="time" type="time" data-i="${i}"></label></div><label>Persone<input data-b="partySize" type="number" min="1" value="4" data-i="${i}"></label></div>`);
const collect=(prefix,fields)=>Array.from({length:4},(_,n)=>Object.fromEntries(fields.map(f=>[f,document.querySelector(`[data-${prefix}="${f}"][data-i="${n+1}"]`).value])));
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return r.json()}
document.querySelector('#accounts').onclick=async()=>{status.textContent='Preparazione account…';const data=await post('/api/accounts/prepare',{profiles:collect('p',['name','email'])});status.textContent=JSON.stringify(data,null,2)};
document.querySelector('#reserve').onclick=async()=>{status.textContent='Preparazione prenotazioni…';const b=collect('b',['restaurant','date','time','partySize']).map(x=>({...x,partySize:Number(x.partySize)}));const data=await post('/api/bookings/prepare',{bookings:b});status.textContent=JSON.stringify(data,null,2)};
</script>
</body>
</html>
