<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TheFork Family Booker</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#f5f5f2}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:40px 20px}h1{font-size:38px;margin:0 0 8px}.muted{color:#666}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile,.booking{padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;margin-top:6px}button{border:0;border-radius:10px;padding:12px 16px;background:#111;color:white;cursor:pointer;margin-top:12px}.secondary{background:#666}.status{white-space:pre-wrap;margin-top:14px;font-size:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>TheFork Family Booker</h1><p class="muted">Carica il CSV delle 4 persone e prepara automaticamente il flusso dei 4 account.</p>
<section class="card"><h2>1. Importa CSV</h2><p class="muted">Colonne supportate: nome, cognome, email, telefono.</p><input id="csv" type="file" accept=".csv,text/csv"><button id="import">Importa 4 persone</button><div id="profiles"></div></section>
<section class="card"><h2>2. Prenotazioni</h2><div id="bookings"></div><button id="reserve">Prepara 4 prenotazioni</button></section>
<section class="card"><strong>Stato</strong><div id="status" class="status">In attesa.</div></section>
</div>
<script>
const profilesBox=document.querySelector('#profiles'),bookingBox=document.querySelector('#bookings'),status=document.querySelector('#status');let profiles=[];
function renderProfiles(){profilesBox.innerHTML=profiles.map((p,i)=>`<div class="profile"><strong>Persona ${i+1}</strong><br>${p.nome} ${p.cognome}<br><span class="muted">${p.email}</span></div>`).join('')}
for(let i=1;i<=4;i++)bookingBox.insertAdjacentHTML('beforeend',`<div class="booking"><strong>Ristorante ${i}</strong><label>Nome<input data-b="restaurant" data-i="${i}"></label><div class="grid"><label>Data<input data-b="date" type="date" data-i="${i}"></label><label>Ora<input data-b="time" type="time" data-i="${i}"></label></div><label>Persone<input data-b="partySize" type="number" min="1" value="4" data-i="${i}"></label></div>`);
function collectBookings(){return Array.from({length:4},(_,n)=>Object.fromEntries(['restaurant','date','time','partySize'].map(f=>[f,document.querySelector(`[data-b="${f}"][data-i="${n+1}"]`).value])).map(x=>({...x,partySize:Number(x.partySize)}))}
document.querySelector('#import').onclick=async()=>{const file=document.querySelector('#csv').files[0];if(!file){status.textContent='Seleziona un CSV.';return}const fd=new FormData();fd.append('file',file);status.textContent='Importazione…';const r=await fetch('/api/csv/preview',{method:'POST',body:fd});const data=await r.json();if(data.ok){profiles=data.profiles;renderProfiles();status.textContent='CSV importato. 4 profili pronti.'}else status.textContent=data.error};
document.querySelector('#reserve').onclick=async()=>{if(profiles.length!==4){status.textContent='Importa prima il CSV.';return}status.textContent='Avvio registrazione dei 4 account…';const r=await fetch('/api/accounts/prepare',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profiles})});const data=await r.json();status.textContent=JSON.stringify(data,null,2)};
</script></body></html>
